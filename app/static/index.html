<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Prompt Flow Chat</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>

  <div class="app">
    <aside class="sidebar">
      <button id="newChatBtn" class="new-chat-btn">
        <span class="plus">+</span> New chat
      </button>
      <div class="history" id="history"></div>
      <div class="sidebar-footer">
        <div class="endpoint-status" id="endpointStatus">
          <span class="dot" id="statusDot"></span>
          <span id="statusText">Checking endpoint…</span>
        </div>
      </div>
    </aside>

    <main class="main">
      <div class="chat-scroll" id="chatScroll">
        <div class="empty-state" id="emptyState">
          <h1>Prompt Flow Chat</h1>
          <p>Ask anything — this talks directly to your deployed flow.</p>
        </div>
        <div class="messages" id="messages"></div>
      </div>

      <div class="composer-wrap">
        <div class="composer">
          <textarea
            id="input"
            placeholder="Message the assistant…"
            rows="1"
            autofocus
          ></textarea>
          <button id="sendBtn" class="send-btn" aria-label="Send" title="Send">
            <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M12 19V5M5 12l7-7 7 7" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
          </button>
        </div>
        <p class="disclaimer">Responses come from your Azure ML endpoint and may be inaccurate.</p>
      </div>
    </main>
  </div>

  <script src="/static/app.js"></script>
</body>
</html>
